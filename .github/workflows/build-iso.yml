name: Build and test installer ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Make room for the kernel build on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            sandbox = true
            substituters = https://cache.nixos.org
            max-jobs = 2
            cores = 4

      - name: Restore previously built packages for this lock file
        id: nix-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci-cache/
          key: nix-runtime-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Import cached Nix store paths
        run: |
          if test -f .ci-cache/closure.nar.gz; then
            gzip -dc .ci-cache/closure.nar.gz | nix-store --import
          fi

      - name: Evaluate all outputs with the committed lock file
        run: nix flake check --no-build --no-write-lock-file --print-build-logs

      - name: Check scripts and Nix formatting
        run: |
          nix develop .#ci --command shellcheck scripts/install-zfs.sh
          nix develop .#ci --command bash -c 'git ls-files "*.nix" -z | xargs -0 nixfmt --check'
          python3 -m py_compile tests/iso_install.py

      - name: Build the installer ISO and offline installation inputs
        run: |
          nix build --no-write-lock-file --print-build-logs .#iso -o result-iso
          nix build --no-write-lock-file --print-build-logs .#install-closure -o result-install
          nix build --no-write-lock-file --print-build-logs .#install-build-inputs -o result-install-build-inputs

      - name: Export built packages before running the VM tests
        if: github.event_name != 'pull_request' && steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-cache
          nix-store --query --requisites "$(readlink -f result-install)" \
            "$(readlink -f result-install-build-inputs)" > .ci-cache/paths
          mapfile -t cache_paths < .ci-cache/paths
          test "${#cache_paths[@]}" -gt 0
          nix-store --export "${cache_paths[@]}" | gzip -1 > .ci-cache/closure.nar.gz

      - name: Save compiled kernel, ZFS and installation dependencies
        if: github.event_name != 'pull_request' && steps.nix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci-cache/
          key: nix-runtime-v1-${{ runner.os }}-${{ hashFiles('flake.lock') }}

      - name: Boot the actual ISO in BIOS and UEFI and install/reboot ZFS
        run: |
          iso=$(find -L result-iso/iso -maxdepth 1 -name '*.iso' -print -quit)
          test -n "$iso"
          nix develop .#ci --command python tests/iso_install.py --iso "$iso"

      - name: Package verified ISO, checksums and verification report
        run: |
          mkdir -p artifacts
          cp -L result-iso/iso/*.iso artifacts/
          cp .vm-test/results.json artifacts/verification.json
          nix eval --json .#nixosConfigurations.installer.config.environment.etc \
            --apply 'etc: builtins.fromJSON etc."nixos-installer/versions.json".text' > artifacts/versions.json
          (cd artifacts && sha256sum ./*.iso > SHA256SUMS)
          cat .vm-test/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified installation ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixos-zfs-cachyos-x86_64-linux
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload boot/install logs even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-verification-logs
          path: |
            .vm-test/*.log
            .vm-test/results.json
          if-no-files-found: ignore
          retention-days: 14
